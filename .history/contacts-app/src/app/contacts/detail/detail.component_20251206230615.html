<div class="contact-card">
    <div class="banner">
      <img src="assets/banner.jpg" alt="Banner">
    </div>
    <div class="profile">
      <img class="avatar" src="assets/avatar.jpg" alt="Profile Photo">
    </div>
    <div class="info">
      <h2>{{ contact.name }}</h2>
      <p class="company">{{ contact.company }}</p>
      <div class="contact-details">
        <p><span class="label">MOBILE</span> {{ contact.mobile }}</p>
        <p><span class="label">WORK</span> {{ contact.work }}</p>
        <p><span class="label">EMAIL</span> {{ contact.email }}</p>
      </div>
    </div>
  </div>
