<div class="contact-card">
    <img class="avatar" [src]="contact.image" alt="avatar">
    <div class="contact-info">
      <h3>{{ contact.name }}</h3>
      <p>{{ contact.fullAddress }}</p>
      <p>{{ contact.email }}</p>
      <p>{{ contact.phone }} | {{ contact.cell }}</p>
    </div>
  </div>
