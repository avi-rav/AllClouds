<div class="contact-card">
    <img class="avatar" [src]="contact.image" alt="avatar">
    <div class="contact-info">
      <h3>{{ contact.name }}</h3>
      <p><span class="label">MOBILE</span> {{ contact.cell }}</p>
      <p><span class="label">Phone</span> {{ contact.phone }}</p>
      <p><span class="label">EMAIL</span> {{ contact.email }}</p>
      <p><span class="label">registration Date</span> {{ contact.registrationDate | date}}</p>
      <p><span class="label">age</span> {{ contact.age }}</p>
      <p><span class="label">EMAIL</span> {{ contact.email }}</p>
      <p><span class="label">EMAIL</span> {{ contact.email }}</p>
    </div>
  </div>
