<div class="contact-card" (click)="openDetail(contact.id)">
    <img class="avatar" [src]="contact.image" alt="avatar">
    <div class="contact-info">
      <h3>{{ contact.name }}</h3>
      <p><span class="label">MOBILE</span> {{ contact.cell }}</p>
      <p><span class="label">Phone</span> {{ contact.phone }}</p>
      <p><span class="label">EMAIL</span> {{ contact.email }}</p>
    </div>
  </div>
