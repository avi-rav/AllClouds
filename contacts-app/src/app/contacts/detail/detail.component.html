<div class="contact-card">
    <div class="banner">
        <img src="assets/images/all-clouds.jpg" alt="Banner" />
        <div class="title">
            <h2 *ngIf="mode === 'create'">Create New Contact</h2>
            <h2 *ngIf="mode === 'edit'">Edit Contact</h2>
            <h2 *ngIf="mode === 'view'">Contact Details</h2>
            <div class="buttons">
                <button (click)="toContact()">Contacts</button>
                <button *ngIf="mode === 'view'" (click)="editContact('Edit')">Edit</button>
                <button *ngIf="mode === 'edit'" (click)="editContact('View')">View</button>
            </div>
        </div>
    </div>
    <div class="profile">
      <img class="avatar" *ngIf="contact.image" [src]="contact.image" [alt]="contact.name + ' Photo'">
      <img class="avatar" *ngIf="!contact.image" src="assets/images/avatar.png" alt="Profile Photo">
    </div>

    <div class="info">
      <h2 *ngIf="mode === 'view'">{{ contact.name }}</h2>
      <h2><input type="text" *ngIf="mode !== 'view'" [(ngModel)]="contact.name" name="name" placeholder="Name" /></h2>
      <div class="contact-details">
        <div class="detail-item">
            <span class="label">full address</span>
            <div *ngIf="mode === 'view'" class="detail-text">{{ contact.fullAddress }}</div>
            <input type="text" *ngIf="mode !== 'view'" [(ngModel)]="contact.fullAddress" name="fullAddress" placeholder="Full Address" />
        </div>
        <div class="detail-item">
            <span class="label">MOBILE</span>
            <div *ngIf="mode === 'view'" class="detail-text">{{ contact.cell }}</div>
            <input type="text" *ngIf="mode !== 'view'" [(ngModel)]="contact.cell" name="cell" placeholder="cell" />
        </div>
        <div class="detail-item">
            <span class="label">Phone</span>
            <div *ngIf="mode === 'view'" class="detail-text">{{ contact.phone }}</div>
            <input type="text" *ngIf="mode !== 'view'" [(ngModel)]="contact.phone" name="phone" placeholder="phone" />
        </div>
        <div class="detail-item">
            <span class="label">EMAIL</span>
            <div *ngIf="mode === 'view'" class="detail-text">{{ contact.email }}</div>
            <input type="email" *ngIf="mode !== 'view'" [(ngModel)]="contact.email" name="email" placeholder="Email" />
        </div>
        <div class="detail-item">
            <span class="label">registration Date</span>
            <div *ngIf="mode === 'view'" class="detail-text">{{ contact.registrationDate | date}}</div>
            <input type="date" *ngIf="mode !== 'view'" [(ngModel)]="contact.registrationDate" name="registrationDate" placeholder="Registration Date" />
        </div>
        <div class="detail-item">
            <span class="label">age</span>
            <div *ngIf="mode === 'view'" class="detail-text">{{ contact.age }}</div>
            <input type="number" *ngIf="mode !== 'view'" [(ngModel)]="contact.age" name="age" placeholder="age" />
        </div>
        <button *ngIf="mode !== 'view'" (click)="save(mode)">{{ mode === 'create' ? 'Create' : 'Update' }}</button>
      </div>
    </div>
  </div>
